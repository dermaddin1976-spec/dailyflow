name: DailyFlow daily reminder

on:
  schedule:
    # 18:00 UTC — roughly 19:00-20:00 in Vienna depending on daylight saving.
    # Adjust the hour here if you want the reminder earlier/later.
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily check-in
        run: |
          curl -sf -X GET "https://dailyflow-gamma.vercel.app/api/notifications/daily-check" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
